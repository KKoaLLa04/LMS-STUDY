<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-5658213a-ea75-4a31-a784-41e8cd4e5e04/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; overflow-x: hidden; }
    * { box-sizing: border-box; }
    body, h1, h2, h3, h4, h5, h6, p, span, div, button, a, label, input { font-family: 'Nunito', sans-serif !important; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</helmet>
<div style="min-height: 100vh; background: var(--color-bg); color: var(--color-text);">

  <header style="position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 20px; padding: 14px 32px; background: var(--color-bg); border-bottom: 1px solid var(--color-divider);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 38px; height: 38px; border-radius: 999px; background: var(--color-accent); display: flex; align-items: center; justify-content: center; color: #fff; flex: none;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <span style="font-size: 20px; font-weight: 900;">Học Vui</span>
    </div>
    <span style="margin-left: 16px; font-size: 14px; font-weight: 800; opacity: 0.8;">Đội ngũ giáo viên</span>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 28px 32px 80px; display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: start;">

    <aside class="card elev-sm" style="position: sticky; top: 78px; gap: 18px;">
      <span style="font-weight: 900; font-size: 15px;">Lọc theo môn học</span>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{ subjectFilters }}" as="sub" hint-placeholder-count="8">
          <button onClick="{{ sub.onClick }}" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid {{ sub.borderColor }}; background: {{ sub.bg }}; cursor: pointer; text-align: left; transition: all .2s ease;">
            <div style="width: 26px; height: 26px; border-radius: 999px; background: {{ sub.iconBg }}; display: flex; align-items: center; justify-content: center; color: #fff; flex: none;">
              <sc-if value="{{ sub.isMath }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg></sc-if>
              <sc-if value="{{ sub.isPhysics }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.5"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)"/></svg></sc-if>
              <sc-if value="{{ sub.isChem }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L4.5 19a1.8 1.8 0 0 0 1.5 2.8h12a1.8 1.8 0 0 0 1.5-2.8L14 9.5V3"/></svg></sc-if>
              <sc-if value="{{ sub.isLit }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></sc-if>
              <sc-if value="{{ sub.isEng }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg></sc-if>
              <sc-if value="{{ sub.isBio }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 5.5 2 9.5 0 6.28-4.5 11.28-10 11.5"/></svg></sc-if>
              <sc-if value="{{ sub.isAll }}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></sc-if>
            </div>
            <span style="font-size: 13px; font-weight: 700; color: {{ sub.textColor }};">{{ sub.name }}</span>
          </button>
        </sc-for>
      </div>
    </aside>

    <div style="display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
        <div style="flex: 1; min-width: 200px; position: relative;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.5;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="input" style="padding-left: 36px;" placeholder="Tìm giáo viên theo tên..." value="{{ searchQuery }}" onChange="{{ onSearchChange }}"/>
        </div>
        <div style="position: relative;">
          <button class="btn btn-secondary" onClick="{{ toggleSort }}" style="font-weight: 800;">
            {{ sortLabel }}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{ sortChevronDeg }}deg); transition: transform .25s ease;"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div style="position: absolute; right: 0; top: 44px; z-index: 10; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-md); box-shadow: var(--shadow-md); overflow: hidden; max-height: {{ sortMenuMaxHeight }}px; opacity: {{ sortMenuOpacity }}; transition: max-height .3s ease, opacity .25s ease; width: 190px;">
            <sc-for list="{{ sortOptions }}" as="opt" hint-placeholder-count="3">
              <div onClick="{{ opt.onClick }}" style="padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; background: {{ opt.bg }};">{{ opt.label }}</div>
            </sc-for>
          </div>
        </div>
      </div>

      <span class="text-muted" style="font-size: 13px; font-weight: 700;">{{ resultCountLabel }}</span>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;">
        <sc-for list="{{ visibleTeachers }}" as="t" hint-placeholder-count="6">
          <div class="card elev-sm" style="align-items: center; text-align: center; gap: 8px; cursor: pointer; animation: fadeInUp .5s ease {{ t.delay }}s both; transition: box-shadow .25s ease, transform .25s ease;" style-hover="{{ liftHover }}">
            <image-slot id="{{ t.slotId }}" shape="circle" placeholder="Ảnh GV" style="width: 84px; height: 84px;"></image-slot>
            <span style="font-weight: 800; font-size: 15px;">{{ t.name }}</span>
            <span class="tag" style="background: {{ t.tagBg }}; color: #fff; font-weight: 800;">{{ t.subject }}</span>
            <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-accent-700); font-weight: 800;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              {{ t.rating }}
            </div>
            <span class="text-muted" style="font-size: 11px; font-weight: 600;">{{ t.courseCount }} khoá học</span>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}">
        <button class="btn btn-secondary" style="align-self: center; font-weight: 800; padding: 12px 28px;" onClick="{{ loadMore }}">
          <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="animation: spin .8s linear infinite;"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
          </sc-if>
          <sc-if value="{{ isNotLoading }}" hint-placeholder-val="{{ true }}">Xem thêm giáo viên</sc-if>
        </button>
      </sc-if>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const SUBJECTS = [
  { key: 'all', name: 'Tất cả', isAll: true, iconBg: 'var(--color-neutral-500)' },
  { key: 'math', name: 'Toán', isMath: true, iconBg: 'var(--color-accent-500)' },
  { key: 'physics', name: 'Vật Lý', isPhysics: true, iconBg: 'var(--color-accent-2-500)' },
  { key: 'chem', name: 'Hóa Học', isChem: true, iconBg: 'var(--color-accent-600)' },
  { key: 'lit', name: 'Ngữ Văn', isLit: true, iconBg: 'var(--color-accent-2-600)' },
  { key: 'eng', name: 'Tiếng Anh', isEng: true, iconBg: 'var(--color-accent-2-400)' },
  { key: 'bio', name: 'Sinh Học', isBio: true, iconBg: 'var(--color-accent-400)' }
];

const TEACHERS = [
  { name: 'Nguyễn Văn An', subject: 'Toán', subjectKey: 'math', rating: 4.8, courses: 18 },
  { name: 'Trần Thị Bích', subject: 'Vật Lý', subjectKey: 'physics', rating: 4.6, courses: 12 },
  { name: 'Lê Minh Khoa', subject: 'Hóa Học', subjectKey: 'chem', rating: 4.9, courses: 21 },
  { name: 'Phạm Thu Hà', subject: 'Ngữ Văn', subjectKey: 'lit', rating: 4.7, courses: 9 },
  { name: 'Vũ Ngọc Lan', subject: 'Tiếng Anh', subjectKey: 'eng', rating: 4.9, courses: 26 },
  { name: 'Đỗ Quang Huy', subject: 'Sinh Học', subjectKey: 'bio', rating: 4.5, courses: 8 },
  { name: 'Hoàng Anh Tuấn', subject: 'Toán', subjectKey: 'math', rating: 4.7, courses: 14 },
  { name: 'Ngô Bảo Châu', subject: 'Vật Lý', subjectKey: 'physics', rating: 4.8, courses: 11 },
  { name: 'Trịnh Thu Trang', subject: 'Hóa Học', subjectKey: 'chem', rating: 4.6, courses: 10 },
  { name: 'Bùi Gia Bảo', subject: 'Ngữ Văn', subjectKey: 'lit', rating: 4.8, courses: 13 },
  { name: 'Lý Khánh Linh', subject: 'Tiếng Anh', subjectKey: 'eng', rating: 4.9, courses: 22 },
  { name: 'Đặng Việt Hoàng', subject: 'Sinh Học', subjectKey: 'bio', rating: 4.5, courses: 7 }
];

const SORTS = [{ key: 'rating', label: 'Đánh giá cao nhất' }, { key: 'courses', label: 'Nhiều khoá học nhất' }, { key: 'name', label: 'Tên A-Z' }];
const PAGE_SIZE = 6;

class Component extends DCLogic {
  state = { activeSubject: 'all', searchQuery: '', sortKey: 'rating', sortOpen: false, visibleCount: PAGE_SIZE, isLoading: false };

  loadMore() {
    this.setState({ isLoading: true });
    setTimeout(() => this.setState(s => ({ visibleCount: s.visibleCount + PAGE_SIZE, isLoading: false })), 700);
  }

  renderVals() {
    const q = this.state.searchQuery.toLowerCase();
    let filtered = TEACHERS.filter(t =>
      (this.state.activeSubject === 'all' || t.subjectKey === this.state.activeSubject) &&
      t.name.toLowerCase().includes(q)
    );
    const sortKey = this.state.sortKey;
    filtered = filtered.slice().sort((a, b) => {
      if (sortKey === 'rating') return b.rating - a.rating;
      if (sortKey === 'courses') return b.courses - a.courses;
      return a.name.localeCompare(b.name);
    });

    const visible = filtered.slice(0, this.state.visibleCount);
    const tagBgs = ['var(--color-accent-500)', 'var(--color-accent-2-500)', 'var(--color-accent-600)', 'var(--color-accent-2-600)'];

    const visibleTeachers = visible.map((t, i) => ({
      ...t, slotId: 'teacher-' + t.name.replace(/\s/g, '-'),
      tagBg: tagBgs[i % tagBgs.length], courseCount: t.courses,
      delay: (i % 6) * 0.07
    }));

    const subjectFilters = SUBJECTS.map(s => {
      const active = s.key === this.state.activeSubject;
      return {
        ...s,
        bg: active ? 'var(--color-accent-100)' : 'transparent',
        borderColor: active ? 'var(--color-accent-400)' : 'var(--color-divider)',
        textColor: active ? 'var(--color-accent-800)' : 'var(--color-text)',
        onClick: () => this.setState({ activeSubject: s.key, visibleCount: PAGE_SIZE })
      };
    });

    const sortOptions = SORTS.map(s => ({
      label: s.label, bg: s.key === sortKey ? 'var(--color-accent-100)' : 'transparent',
      onClick: () => this.setState({ sortKey: s.key, sortOpen: false })
    }));
    const sortLabel = SORTS.find(s => s.key === sortKey).label;

    return {
      subjectFilters, searchQuery: this.state.searchQuery,
      onSearchChange: e => this.setState({ searchQuery: e.target.value, visibleCount: PAGE_SIZE }),
      toggleSort: () => this.setState(s => ({ sortOpen: !s.sortOpen })),
      sortLabel, sortOptions,
      sortChevronDeg: this.state.sortOpen ? 180 : 0,
      sortMenuMaxHeight: this.state.sortOpen ? 200 : 0,
      sortMenuOpacity: this.state.sortOpen ? 1 : 0,
      resultCountLabel: filtered.length + ' giáo viên',
      visibleTeachers,
      hasMore: this.state.visibleCount < filtered.length,
      isLoading: this.state.isLoading, isNotLoading: !this.state.isLoading,
      loadMore: () => this.loadMore(),
      liftHover: { transform: 'translateY(-5px)', boxShadow: 'var(--shadow-md)' }
    };
  }
}

</script>
</body>
</html>

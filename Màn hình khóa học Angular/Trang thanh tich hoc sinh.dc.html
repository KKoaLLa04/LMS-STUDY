<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-5658213a-ea75-4a31-a784-41e8cd4e5e04/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; overflow-x: hidden; }
    * { box-sizing: border-box; }
    body, h1, h2, h3, h4, h5, h6, p, span, div, button, a, label { font-family: 'Nunito', sans-serif !important; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-6deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(4deg); } }
    @keyframes shine { 0% { transform: translateX(-120%) rotate(20deg); } 100% { transform: translateX(220%) rotate(20deg); } }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
  </style>
</helmet>
<div style="min-height: 100vh; background: var(--color-bg); color: var(--color-text);">

  <header style="position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 20px; padding: 14px 32px; background: var(--color-bg); border-bottom: 1px solid var(--color-divider);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 38px; height: 38px; border-radius: 999px; background: var(--color-accent); display: flex; align-items: center; justify-content: center; color: #fff; flex: none;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <span style="font-size: 20px; font-weight: 900;">Học Vui</span>
    </div>
    <span style="margin-left: 16px; font-size: 14px; font-weight: 800; opacity: 0.8;">Thành tích của tôi</span>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 32px 32px 80px; display: flex; flex-direction: column; gap: 32px;">

    <section ref="{{ headerRef }}" style="position: relative; overflow: hidden; background: linear-gradient(135deg, var(--color-accent-600), var(--color-accent-2-600)); border-radius: var(--radius-lg); padding: 36px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; box-shadow: var(--shadow-lg);">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="rgba(255,255,255,0.14)" stroke="none" style="position: absolute; right: 30px; top: -10px; animation: floatSlow 6s ease-in-out infinite;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <div style="display: flex; flex-direction: column; gap: 6px; color: #fff;">
        <span style="font-size: 14px; font-weight: 800; opacity: 0.9;">✦ Tổng huy hiệu đạt được</span>
        <span style="font-size: 46px; font-weight: 900; line-height: 1;">{{ counterDisplay }}</span>
        <span style="font-size: 13px; opacity: 0.85; font-weight: 700;">trên tổng số {{ totalBadges }} huy hiệu</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.16); border-radius: var(--radius-lg); padding: 16px 22px; color: #fff;">
        <div style="width: 52px; height: 52px; border-radius: 999px; background: linear-gradient(135deg, #ffd76a, #ff9d4d); display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 0 0 4px rgba(255,255,255,0.25); animation: popIn .5s ease;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" stroke="none"><circle cx="12" cy="8" r="6"/><path d="M8.5 13 6 22l6-3 6 3-2.5-9"/></svg>
        </div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 12px; opacity: 0.85; font-weight: 700;">Huy hiệu mới nhất</span>
          <span style="font-size: 15px; font-weight: 800;">{{ latestBadge.name }}</span>
        </div>
      </div>
    </section>

    <div class="seg" style="width: fit-content;">
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
        <label class="seg-opt" style="{{ tab.segStyle }}" onClick="{{ tab.onClick }}">{{ tab.label }}</label>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px;">
      <sc-for list="{{ filteredBadges }}" as="badge" hint-placeholder-count="6">
        <div ref="{{ badge.ref }}" class="card elev-sm" style="align-items: center; text-align: center; gap: 10px; position: relative; overflow: hidden; opacity: {{ badge.revealOpacity }}; transform: {{ badge.revealTransform }}; transition: opacity .5s ease {{ badge.revealDelay }}s, transform .5s ease {{ badge.revealDelay }}s, box-shadow .25s ease;" style-hover="{{ badge.hoverStyle }}">
          <sc-if value="{{ badge.unlocked }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: 0; left: 0; width: 60%; height: 100%; background: linear-gradient(115deg, transparent, rgba(255,255,255,0.55), transparent); pointer-events: none;" style-hover="{{ shineStyle }}"></div>
          </sc-if>
          <div style="width: 76px; height: 76px; border-radius: 999px; background: {{ badge.medalBg }}; display: flex; align-items: center; justify-content: center; position: relative; filter: {{ badge.filter }};" style-hover="{{ badge.iconHoverStyle }}">
            <sc-if value="{{ badge.isBook }}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></sc-if>
            <sc-if value="{{ badge.isFlame }}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></sc-if>
            <sc-if value="{{ badge.isChat }}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></sc-if>
            <sc-if value="{{ badge.isTrophy }}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4a2 2 0 0 0 2 4M17 5h3a2 2 0 0 1-2 4"/></svg></sc-if>
            <sc-if value="{{ badge.isTarget }}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="#fff"/></svg></sc-if>
            <sc-if value="{{ badge.isHeart }}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M12 21s-7-4.5-9.5-9C.6 8.2 2 4.5 6 4c2-.3 3.5.7 6 3 2.5-2.3 4-3.3 6-3 4 .5 5.4 4.2 3.5 8-2.5 4.5-9.5 9-9.5 9z"/></svg></sc-if>
            <sc-if value="{{ badge.locked }}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 999px; background: var(--color-neutral-500); display: flex; align-items: center; justify-content: center; border: 2px solid var(--color-bg);">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
            </sc-if>
          </div>
          <span style="font-weight: 800; font-size: 14px;">{{ badge.name }}</span>
          <span class="text-muted" style="font-size: 11px; font-weight: 600; min-height: 28px;">{{ badge.desc }}</span>
          <sc-if value="{{ badge.locked }}" hint-placeholder-val="{{ false }}">
            <div style="width: 100%; display: flex; flex-direction: column; gap: 4px;">
              <div style="width: 100%; height: 7px; border-radius: 999px; background: var(--color-neutral-200); overflow: hidden;">
                <div style="height: 100%; border-radius: 999px; background: var(--color-accent); width: {{ badge.progressDisplay }}%; transition: width 1s ease .2s;"></div>
              </div>
              <span class="text-muted" style="font-size: 10px; font-weight: 700;">{{ badge.progress }}% hoàn thành</span>
            </div>
          </sc-if>
          <sc-if value="{{ badge.unlocked }}" hint-placeholder-val="{{ false }}">
            <span class="tag" style="background: linear-gradient(135deg, #ffd76a, #ff9d4d); color: #7a4a00; font-weight: 800; width: fit-content;">Đã đạt được</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const BADGES = [
  { id: 'b1', category: 'hoctap', name: 'Mọt sách nhỏ', desc: 'Hoàn thành 10 bài học', icon: 'book', unlocked: true },
  { id: 'b2', category: 'hoctap', name: 'Siêu trí tuệ', desc: 'Đạt điểm tuyệt đối 5 bài kiểm tra', icon: 'target', unlocked: true },
  { id: 'b3', category: 'hoctap', name: 'Bậc thầy kiến thức', desc: 'Hoàn thành 5 khoá học', icon: 'trophy', unlocked: false, progress: 60 },
  { id: 'b4', category: 'chuyencan', name: 'Lửa nhiệt huyết', desc: 'Học liên tục 7 ngày', icon: 'flame', unlocked: true },
  { id: 'b5', category: 'chuyencan', name: 'Kiên trì bền bỉ', desc: 'Học liên tục 30 ngày', icon: 'flame', unlocked: false, progress: 23 },
  { id: 'b6', category: 'chuyencan', name: 'Dậy sớm học bài', desc: 'Học trước 7 giờ sáng 5 lần', icon: 'target', unlocked: false, progress: 40 },
  { id: 'b7', category: 'tuongtac', name: 'Người bạn tốt', desc: 'Bình luận giúp đỡ 10 bạn học', icon: 'chat', unlocked: true },
  { id: 'b8', category: 'tuongtac', name: 'Trái tim vàng', desc: 'Nhận 20 lượt cảm ơn', icon: 'heart', unlocked: false, progress: 75 },
  { id: 'b9', category: 'tuongtac', name: 'Người truyền cảm hứng', desc: 'Được 100 bạn theo dõi', icon: 'chat', unlocked: false, progress: 12 }
];
const TABS = [{ key: 'all', label: 'Tất cả' }, { key: 'hoctap', label: 'Học tập' }, { key: 'chuyencan', label: 'Chuyên cần' }, { key: 'tuongtac', label: 'Tương tác' }];

class Component extends DCLogic {
  state = { activeTab: 'all', counterProgress: 0, counted: false, revealed: {}, badgeReveal: {} };
  badgeRefs = {};
  headerRef = React.createRef();

  getBadgeRef(id) {
    if (!this.badgeRefs[id]) this.badgeRefs[id] = React.createRef();
    return this.badgeRefs[id];
  }

  componentDidMount() {
    this._observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        if (entry.target === this.headerRef.current && !this.state.counted) this.startCounter();
        const id = Object.keys(this.badgeRefs).find(k => this.badgeRefs[k].current === entry.target);
        if (id) this.setState(s => ({ badgeReveal: { ...s.badgeReveal, [id]: true } }));
      });
    }, { threshold: 0.15 });
    if (this.headerRef.current) this._observer.observe(this.headerRef.current);
    Object.values(this.badgeRefs).forEach(r => { if (r.current) this._observer.observe(r.current); });
  }
  componentWillUnmount() {
    if (this._observer) this._observer.disconnect();
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  startCounter() {
    this.setState({ counted: true });
    const start = performance.now();
    const duration = 1000;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      this.setState({ counterProgress: 1 - Math.pow(1 - t, 3) });
      if (t < 1) this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }

  renderVals() {
    const unlockedCount = BADGES.filter(b => b.unlocked).length;
    const displayCount = Math.round(unlockedCount * this.state.counterProgress);
    const latestBadge = BADGES.filter(b => b.unlocked).slice(-1)[0] || BADGES[0];

    const tabs = TABS.map(t => {
      const active = t.key === this.state.activeTab;
      return {
        label: t.label,
        segStyle: active ? 'background: var(--color-accent); color: var(--color-bg); font-weight: 800;' : 'font-weight: 700;',
        onClick: () => this.setState({ activeTab: t.key })
      };
    });

    const filtered = BADGES.filter(b => this.state.activeTab === 'all' || b.category === this.state.activeTab);

    const filteredBadges = filtered.map((b, i) => {
      const ref = this.getBadgeRef(b.id);
      const revealed = !!this.state.badgeReveal[b.id];
      const goldGrad = 'linear-gradient(135deg, #ffd76a, #ff9d4d)';
      const lockedGrad = 'linear-gradient(135deg, var(--color-neutral-400), var(--color-neutral-500))';
      return {
        ...b, ref,
        isBook: b.icon === 'book', isFlame: b.icon === 'flame', isChat: b.icon === 'chat',
        isTrophy: b.icon === 'trophy', isTarget: b.icon === 'target', isHeart: b.icon === 'heart',
        locked: !b.unlocked,
        progressDisplay: b.unlocked ? 0 : Math.round((b.progress || 0) * (revealed ? 1 : 0)),
        medalBg: b.unlocked ? goldGrad : lockedGrad,
        filter: b.unlocked ? 'none' : 'grayscale(0.6)',
        revealOpacity: revealed ? 1 : 0,
        revealTransform: revealed ? 'translateY(0)' : 'translateY(20px)',
        revealDelay: (i % 6) * 0.08,
        hoverStyle: { boxShadow: 'var(--shadow-md)', transform: 'translateY(-4px)' },
        iconHoverStyle: b.unlocked
          ? { transform: 'scale(1.1)', boxShadow: '0 0 0 6px rgba(255,183,77,0.3)' }
          : { animation: 'shake .4s ease' }
      };
    });

    return {
      headerRef: this.headerRef,
      counterDisplay: String(displayCount),
      totalBadges: BADGES.length,
      latestBadge,
      tabs, filteredBadges,
      shineStyle: { animation: 'shine .9s ease' }
    };
  }
}

</script>
</body>
</html>

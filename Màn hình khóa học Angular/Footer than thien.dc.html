<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-5658213a-ea75-4a31-a784-41e8cd4e5e04/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    body, h1, h2, h3, h4, h5, h6, p, span, div, button, a, label, input { font-family: 'Nunito', sans-serif !important; }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
  </style>
</helmet>
<footer style="position: relative; overflow: hidden; background: var(--color-accent-2-900); color: var(--color-bg); padding: 56px 32px 0;">

  <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 40px; top: 24px; animation: floatSlow 7s ease-in-out infinite;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
  <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 130px; bottom: 90px; animation: floatSlow 8s ease-in-out infinite 1s;"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>

  <div style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.3fr; gap: 32px; position: relative;">

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 38px; height: 38px; border-radius: 999px; background: var(--color-accent); display: flex; align-items: center; justify-content: center; color: #fff; flex: none;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <span style="font-size: 20px; font-weight: 900;">Học Vui</span>
      </div>
      <p style="margin: 0; font-size: 13px; opacity: 0.75; font-weight: 600; max-width: 260px;">Nền tảng học trực tuyến thân thiện, giúp học sinh học vui &amp; học giỏi mỗi ngày.</p>
      <div style="display: flex; gap: 10px; margin-top: 4px;">
        <sc-for list="{{ socials }}" as="s" hint-placeholder-count="4">
          <a href="{{ s.href }}" aria-label="{{ s.label }}" style="width: 38px; height: 38px; border-radius: 999px; background: {{ s.bg }}; display: flex; align-items: center; justify-content: center; color: #fff; text-decoration: none; transition: transform .25s ease;" style-hover="{{ socialHover }}">
            <sc-if value="{{ s.isFb }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></sc-if>
            <sc-if value="{{ s.isYt }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 8.5s-.2-1.6-.9-2.3c-.8-.9-1.7-.9-2.2-1C16.1 5 12 5 12 5s-4.1 0-7.4.2c-.5.1-1.3.1-2.2 1-.7.7-.9 2.3-.9 2.3S1.3 10.4 1.3 12.2v1.6c0 1.9.2 3.7.2 3.7s.2 1.6.9 2.3c.9.9 2 .9 2.5 1 1.8.2 7.6.2 7.6.2s4.1 0 7.4-.3c.5-.1 1.3-.1 2.2-1 .7-.7.9-2.3.9-2.3s.2-1.9.2-3.7v-1.6c0-1.9-.2-3.7-.2-3.7z"/><polygon points="9.8 15.3 15.5 12 9.8 8.7 9.8 15.3"/></svg></sc-if>
            <sc-if value="{{ s.isIg }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg></sc-if>
            <sc-if value="{{ s.isTt }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17a4 4 0 1 0 4-4V3h3a5 5 0 0 0 5 5"/></svg></sc-if>
          </a>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 14px; font-weight: 800; opacity: 0.9;">Danh mục</span>
      <sc-for list="{{ categoryLinks }}" as="link" hint-placeholder-count="4">
        <a href="{{ link.href }}" style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); text-decoration: none; transition: color .2s ease, transform .2s ease;" style-hover="{{ linkHover }}">{{ link.label }}</a>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 14px; font-weight: 800; opacity: 0.9;">Hỗ trợ</span>
      <sc-for list="{{ supportLinks }}" as="link" hint-placeholder-count="4">
        <a href="{{ link.href }}" style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); text-decoration: none; transition: color .2s ease, transform .2s ease;" style-hover="{{ linkHover }}">{{ link.label }}</a>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 14px; font-weight: 800; opacity: 0.9;">Đăng ký nhận tin</span>
      <p style="margin: 0; font-size: 12px; opacity: 0.7; font-weight: 600;">Nhận thông báo khoá học mới &amp; ưu đãi hấp dẫn.</p>
      <div style="display: flex; gap: 8px; align-items: center;">
        <div style="position: relative; flex: 1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
          <input class="input" placeholder="Email của bạn" style="padding-left: 34px; background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); color: #fff; font-weight: 600;"/>
        </div>
      </div>
      <button class="btn" style="background: var(--color-accent); color: #fff; border-radius: 999px; font-weight: 800; width: fit-content; padding: 10px 22px; transition: transform .2s ease, box-shadow .2s ease;" style-hover="{{ subscribeHover }}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Đăng ký
      </button>
    </div>
  </div>

  <div class="hr" style="margin: 40px auto 0; max-width: 1200px; border-color: rgba(255,255,255,0.15);"></div>

  <div style="max-width: 1200px; margin: 0 auto; padding: 18px 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
    <span style="font-size: 12px; opacity: 0.65; font-weight: 600;">© 2026 Học Vui. Đã đăng ký bản quyền.</span>
    <div style="display: flex; gap: 10px; align-items: center;">
      <sc-for list="{{ paymentBadges }}" as="badge" hint-placeholder-count="4">
        <span style="font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85);">{{ badge }}</span>
      </sc-for>
    </div>
  </div>
</footer>

</x-dc>
<script type="text/x-dc" data-dc-script>
const SOCIALS = [
  { label: 'Facebook', href: '#', bg: 'var(--color-accent-500)', key: 'fb' },
  { label: 'YouTube', href: '#', bg: 'var(--color-accent-2-500)', key: 'yt' },
  { label: 'Instagram', href: '#', bg: 'var(--color-accent-600)', key: 'ig' },
  { label: 'TikTok', href: '#', bg: 'var(--color-accent-2-600)', key: 'tt' }
];
const CATEGORY_LINKS = ['Khoá học', 'Giáo viên', 'Bảng xếp hạng', 'Thành tích'];
const SUPPORT_LINKS = ['FAQ', 'Liên hệ', 'Chính sách', 'Điều khoản sử dụng'];
const PAYMENT_BADGES = ['VISA', 'Momo', 'ZaloPay', 'VNPay'];

class Component extends DCLogic {
  renderVals() {
    return {
      socials: SOCIALS.map(s => ({ ...s, isFb: s.key === 'fb', isYt: s.key === 'yt', isIg: s.key === 'ig', isTt: s.key === 'tt' })),
      categoryLinks: CATEGORY_LINKS.map(l => ({ label: l, href: '#' })),
      supportLinks: SUPPORT_LINKS.map(l => ({ label: l, href: '#' })),
      paymentBadges: PAYMENT_BADGES,
      socialHover: { transform: 'scale(1.15) rotate(-6deg)' },
      linkHover: { color: '#fff', transform: 'translateX(3px)' },
      subscribeHover: { transform: 'translateY(-2px)', boxShadow: '0 6px 18px rgba(0,0,0,0.25)' }
    };
  }
}

</script>
</body>
</html>

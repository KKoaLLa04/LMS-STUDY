<div class="oc-accordion">
  @for (chapter of chapters; track chapter.id) {
    <div class="oc-card oc-elev-sm oc-accordion__chapter">
      <button type="button" class="oc-accordion__header" (click)="toggle(chapter.id)">
        <div class="oc-accordion__heading">
          <span class="oc-card-title oc-accordion__title">{{ chapter.title }}</span>
          <span class="oc-text-muted oc-accordion__meta">{{ chapterMeta(chapter) }}</span>
        </div>
        <span class="oc-accordion__chevron" [class.is-open]="isExpanded(chapter.id)">
          <app-oc-icon name="chevron-down" [size]="18"></app-oc-icon>
        </span>
      </button>

      <div class="oc-accordion__body" [@expandCollapse]="isExpanded(chapter.id) ? 'expanded' : 'collapsed'">
        @for (lesson of chapter.lessons; track lesson.id) {
          <button
            type="button"
            class="oc-accordion__lesson"
            [class.is-highlighted]="lesson.id === nextLessonId"
            [class.is-playable]="isLessonPlayable(lesson)"
            [disabled]="!isLessonPlayable(lesson)"
            (click)="toggleLessonVideo(lesson)"
          >
            <span class="oc-accordion__lesson-icon" [class]="'is-' + lesson.status">
              @switch (lesson.status) {
                @case ('done') {
                  <app-oc-icon name="check" [size]="13" color="var(--oc-bg)"></app-oc-icon>
                }
                @case ('locked') {
                  <app-oc-icon name="lock" [size]="12" color="var(--oc-text)"></app-oc-icon>
                }
                @default {
                  <app-oc-icon name="play" [size]="12" color="var(--oc-accent-2-800)"></app-oc-icon>
                }
              }
            </span>
            <span class="oc-accordion__lesson-title" [class.is-locked]="lesson.status === 'locked'">{{ lesson.title }}</span>
            <span class="oc-text-muted oc-accordion__lesson-duration">{{ lesson.durationMinutes }}p</span>
          </button>
          @if (playingLessonId() === lesson.id) {
            @switch (lesson.lessonType) {
              @case ('Document') {
                <div class="oc-accordion__lesson-document">
                  @if (lesson.content) {
                    <div class="oc-accordion__lesson-document-content" [innerHTML]="lesson.content"></div>
                  }
                  @if (lesson.documentUrl) {
                    <a class="oc-btn oc-btn-ghost" [href]="lesson.documentUrl" target="_blank" rel="noopener">
                      <app-oc-icon name="download" [size]="14"></app-oc-icon>
                      Tải tài liệu
                    </a>
                  }
                </div>
              }
              @case ('Quiz') {
                <app-oc-quiz-player [lessonId]="lesson.id"></app-oc-quiz-player>
              }
              @default {
                <video
                  class="oc-accordion__lesson-video"
                  [src]="lesson.videoUrl"
                  controls
                  autoplay
                ></video>
              }
            }
          }
        }
      </div>
    </div>
  }
</div>

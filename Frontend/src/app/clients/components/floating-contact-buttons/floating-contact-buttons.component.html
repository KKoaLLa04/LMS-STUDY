<div class="oc-fab">
  <div
    class="oc-fab__items"
    [class.oc-fab__items--open]="open()"
    [@fabStagger]="open() ? 'open' : 'closed'"
  >
    <a
      class="oc-fab__item oc-fab__item--zalo"
      [href]="zaloLink"
      target="_blank"
      rel="noopener noreferrer"
      [attr.tabindex]="open() ? 0 : -1"
      [attr.aria-hidden]="!open()"
      (click)="close()"
    >
      <span class="oc-fab__label">Chat Zalo</span>
      <span class="oc-fab__circle oc-fab__circle--zalo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"
          ></path>
        </svg>
      </span>
    </a>

    <a
      class="oc-fab__item oc-fab__item--hotline"
      [href]="phoneHref"
      [attr.tabindex]="open() ? 0 : -1"
      [attr.aria-hidden]="!open()"
      (click)="close()"
    >
      <span class="oc-fab__label">{{ phone }}</span>
      <span class="oc-fab__circle oc-fab__circle--hotline">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"></path>
        </svg>
      </span>
    </a>

    <a
      class="oc-fab__item oc-fab__item--facebook"
      [href]="facebookLink"
      target="_blank"
      rel="noopener noreferrer"
      [attr.tabindex]="open() ? 0 : -1"
      [attr.aria-hidden]="!open()"
      (click)="close()"
    >
      <span class="oc-fab__label">Facebook</span>
      <span class="oc-fab__circle oc-fab__circle--facebook">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff">
          <path
            d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94Z"
          ></path>
        </svg>
      </span>
    </a>
  </div>

  <button
    type="button"
    class="oc-fab__main"
    [class.oc-fab__main--open]="open()"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="open() ? 'Đóng liên hệ nhanh' : 'Mở liên hệ nhanh'"
  >
    <span class="oc-fab__main-icon-wrap">
      <svg
        class="oc-fab__main-icon oc-fab__main-icon--chat"
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#fff"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"
        ></path>
      </svg>
      <svg
        class="oc-fab__main-icon oc-fab__main-icon--close"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#fff"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="6" y1="6" x2="18" y2="18"></line>
        <line x1="18" y1="6" x2="6" y2="18"></line>
      </svg>
    </span>
  </button>
</div>

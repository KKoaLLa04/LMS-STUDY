<main class="oc-cp">
  <div class="oc-card oc-elev-sm oc-cp-card">
    <div class="oc-cp-header">
      <app-oc-icon name="key" [size]="20" color="var(--oc-accent)"></app-oc-icon>
      <h1 class="oc-cp-title">Đổi mật khẩu</h1>
    </div>

    <form class="oc-cp-form" (ngSubmit)="onSubmit()">
      <label class="oc-cp-field">
        <span>Mật khẩu hiện tại</span>
        <input class="oc-input" type="password" name="currentPassword" [(ngModel)]="currentPassword" autocomplete="current-password" />
      </label>

      <label class="oc-cp-field">
        <span>Mật khẩu mới</span>
        <input class="oc-input" type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" />
      </label>

      <label class="oc-cp-field">
        <span>Xác nhận mật khẩu mới</span>
        <input class="oc-input" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password" />
      </label>

      @if (errorMessage()) {
        <p class="oc-cp-error">{{ errorMessage() }}</p>
      }

      <div class="oc-cp-actions">
        <a class="oc-btn oc-btn-secondary" routerLink="/client/ho-so">Hủy</a>
        <button class="oc-btn oc-btn-primary" type="submit" [disabled]="loading()">
          {{ loading() ? 'Đang lưu...' : 'Lưu thay đổi' }}
        </button>
      </div>
    </form>
  </div>
</main>
